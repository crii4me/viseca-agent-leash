[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-compiler"
version = "0.1.0"
description = "Function 1 of the Viseca 'Agent on a Leash' control layer: plain-English spending instruction -> structured mandate."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.9",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
